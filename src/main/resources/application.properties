spring.application.name=coleta-seletiva

# --- Banco de dados (valores vêm de variáveis de ambiente; ver .env.example) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coleta_seletiva}
spring.datasource.username=${DB_USER:coleta_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA: o esquema é controlado pelo Flyway; o Hibernate apenas valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Paginação: máximo de 100 registros por página (RNF04) ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Erros: nunca expor stack trace (RNF03) ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
